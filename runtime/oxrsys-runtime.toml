# OXRSys Runtime Configuration
# Preferred location:
#   macOS: ~/Library/Application Support/OXRSys/oxrsys-runtime.toml
#   Linux: ${XDG_CONFIG_HOME:-~/.config}/oxrsys/oxrsys-runtime.toml
# Fallback location: next to liboxrsys-runtime.dylib / liboxrsys-runtime.so

[general]
# Enable or disable this runtime without unregistering the manifest.
# When false, xrCreateInstance returns XR_ERROR_RUNTIME_UNAVAILABLE.
runtime_enabled = true

[streaming]
# H.265 encoding bitrate in Mbps. Lower = less latency but more artifacts.
# Try 20-30 for lower latency, 50+ for quality.
bitrate_mbps = 50

# Preferred headset display refresh rate. Supported values: 60, 72, 80, 90, 120.
refresh_rate_hz = 72

# Resolution multiplier (0.25 to 1.0). Lower = faster encode, less bandwidth, more blur.
# 0.5 = half resolution (recommended for WiFi), 1.0 = native resolution.
resolution_scale = 0.75

# Keyframe interval in seconds (1-10). Higher = less bandwidth spikes, slower recovery.
# Default 2 is a good balance. Use 1 for lossy WiFi, 5+ for USB.
keyframe_interval_sec = 2

# Encoder speed preset: "quality", "balanced", "speed"
# speed  = lowest latency, fastest encode, lower quality
# balanced = default, good mix
# quality  = best visual quality, slightly higher latency
encoder_preset = "balanced"

# Out-of-process native-arm64 HARDWARE HEVC encoder helper.
# The runtime dylib is loaded in-process by the x86_64/Rosetta Wine host, and
# VideoToolbox refuses the hardware HEVC encoder to an x86_64/Rosetta process
# (it silently falls back to the software encoder, ~27-40ms/frame). When this is
# enabled, the runtime spawns a small native-arm64 helper process that IS granted
# the hardware HEVC encoder (~8ms/frame), sharing the compose IOSurfaces zero-copy
# via mach send rights. If the helper cannot start or does not get the hardware
# encoder, the runtime transparently falls back to the in-process software path
# (never a black screen). Default off (opt-in).
encoder_helper = false
# Path to the helper binary. Empty = look for "oxrsys-encoder-helper" next to the
# runtime dylib (also overridable at runtime via $OXRSYS_ENCODER_HELPER_PATH).
encoder_helper_path = ""

# Streaming transport: "auto" tries USB ADB reverse and WiFi, "wifi" disables USB TCP
# listeners, and "usb_adb" disables WiFi discovery fallback.
transport = "auto"

# Server-side foveated video encoding preset: "off", "light", "medium", or "high".
# This compresses frame edges before video encoding and asks compatible clients
# to re-expand the image after decode.
foveated_encoding_preset = "off"

# Headset client foveation override: "auto", "off", "light", "medium", or "high".
# "auto" leaves the headset client unmanaged by Home/runtime config.
client_foveation_preset = "auto"

# Enable Quest shader upscaling after video decode.
client_upscaling = false

# Quest client reprojection for short decode/network gaps: "off", "pose", or "pose_warp".
client_reprojection = "pose"

# Adaptive bitrate mode: "off", "bitrate", or "full".
# "full" may select resolution/foveation/upscaling profiles after session-safe transitions.
abr_mode = "bitrate"

# Stream game audio to the headset (USB transport only for now).
# On macOS the runtime captures a loopback INPUT device (e.g. BlackHole): install
# one, route the game's output to it (a Multi-Output Device also including your
# speakers lets you hear it too), and set this to true. A Core Audio system tap
# does not work under CrossOver (silence — needs System-Audio-Recording
# permission it can't request); a loopback input uses the Microphone permission.
# The audio stream is advertised only when this is on and the client reports the
# AUDIO_OUTPUT capability.
headset_audio = false

[wired]
# Wired headset (Windows Mixed Reality through the Monado driver, macOS only).
# When true and a headset is plugged in at xrGetSystem time, it replaces the
# streaming client: tracking comes from the headset's own sensors and frames are
# shown on its panel through the lens distortion warp. The panel must be visible
# to macOS as a display; see docs/platforms/wmr.md for the EDID override.
wired_headset = false

# CGDirectDisplayID of the panel. 0 = auto-detect (a display with a mode of the
# panel's size, or the display that hot-plugs after the headset switches on).
wired_display_id = 0

# Head tracking is orientation-only for now; the head is reported at this
# height above the STAGE floor, in meters.
wired_eye_height_m = 1.6

[logging]
# Write server logs to the platform state directory.
#   macOS: ~/Library/Application Support/OXRSys/oxrsys-runtime.log
#   Linux: ${XDG_STATE_HOME:-~/.local/state}/oxrsys/oxrsys-runtime.log
file_logging = true

# Capture Quest/headset logcat to the platform state directory.
# Requires adb in PATH and a connected device.
quest_logcat = false
